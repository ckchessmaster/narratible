[project]
name = "narratible-runtime-chatterbox"
version = "1.0.0"
requires-python = "==3.12.*"
dependencies = [
    "chatterbox-tts==0.1.7",
    "librosa==0.11.0",
    "soundfile==0.14.0",
    "torch==2.11.0",
    "torchaudio==2.11.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
override-dependencies = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true