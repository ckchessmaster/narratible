name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string to embed (e.g. 1.2.0). Defaults to the tag name on tag pushes.'
        required: false
        type: string
        default: '0.0.0-dev'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set Version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match 'refs/tags/v(.+)') {
            $version = $matches[1]
          } else {
            $version = '${{ inputs.version }}'
          }
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV
          echo "NARRATIBLE_APP_VERSION=$version" >> $env:GITHUB_ENV
          echo "VITE_APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Cache pip (base dependencies)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-base-${{ runner.os }}-${{ hashFiles('backend/requirements*.txt', 'backend/constraints.txt') }}
          restore-keys: pip-base-${{ runner.os }}-

      - name: Cache pip (GPU ML components)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-gpu-${{ runner.os }}-cu128-torch2.11-${{ hashFiles('backend/requirements-gpu.txt', 'backend/requirements-chatterbox.txt', 'backend/requirements-qwen3-tts.txt', 'backend/constraints.txt') }}
          restore-keys: pip-gpu-${{ runner.os }}-cu128-

      - name: Cache PyInstaller work directory
        uses: actions/cache@v4
        with:
          path: build
          key: pyinstaller-cu128-${{ runner.os }}-${{ hashFiles('narratible.spec', 'desktop_app.py', 'backend/**/*.py') }}
          restore-keys: pyinstaller-cu128-${{ runner.os }}-

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install PyTorch (CUDA build)
        run: |
          python -m pip install "pip==26.2.1" "setuptools==70.2.0"
          # Install the CUDA-enabled torch/torchaudio FIRST so it is the build that
          # gets frozen. requirements.txt would otherwise pull the +cpu wheel from
          # PyPI as a transitive dependency, leaving CUDA permanently unavailable.
          pip install -c backend/constraints.txt "torch==2.11.0" "torchaudio==2.11.0" --index-url https://download.pytorch.org/whl/cu128

      - name: Install Python Dependencies
        run: |
          # Base deps. The CUDA torch installed above already satisfies the torch
          # requirement, so these will NOT replace it with a +cpu wheel.
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-build.txt

      - name: Install GPU ML Components
        run: |
          pip install -r backend/requirements-gpu.txt
          # Chatterbox pins an older torch build in its package metadata. Install
          # all of its dependencies first, then restore the CUDA build selected by
          # this release below. Runtime compatibility is checked before freezing.
          pip install -r backend/requirements-chatterbox.txt
          pip install -r backend/requirements-qwen3-tts.txt
          pip install --no-deps -c backend/constraints.txt "qwen-tts==0.1.1"

      - name: Restore release ML builds
        run: |
          pip install --upgrade --force-reinstall -c backend/constraints.txt "torch==2.11.0" "torchaudio==2.11.0" --index-url https://download.pytorch.org/whl/cu128
          # Chatterbox replaces Transformers and its coupled dependencies with
          # older releases. Restore the complete constrained Transformers stack.
          pip install --upgrade --force-reinstall -c backend/constraints.txt "transformers @ git+https://github.com/huggingface/transformers.git@a530903e4e61784ca980bdbbca187f2b4db5ed59"

      - name: Verify CUDA-enabled PyTorch
        shell: pwsh
        run: |
          # The runner has no GPU, so torch.cuda.is_available() is always False here.
          # Instead assert this is a CUDA *build* (torch.version.cuda is set), which is
          # what determines whether the shipped app can ever reach a GPU.
          python -c "import torch, torchaudio, sys; print('torch', torch.__version__, '| torchaudio', torchaudio.__version__, '| cuda', torch.version.cuda); sys.exit(0 if torch.version.cuda else 1)"
          if ($LASTEXITCODE -ne 0) { throw 'PyTorch is a CPU-only build (torch.version.cuda is None). Aborting to avoid shipping a non-GPU installer.' }
          python -c "from chatterbox.tts import ChatterboxTTS; import tokenizers, torch, transformers; print('Chatterbox import OK with torch', torch.__version__, '| transformers', transformers.__version__, '| tokenizers', tokenizers.__version__)"
          python -c "from backend.app.tts import _prepare_qwen3_transformers; _prepare_qwen3_transformers(); from qwen_tts import Qwen3TTSModel; import torch, transformers; print('Qwen3-TTS import OK with torch', torch.__version__, '| transformers', transformers.__version__)"

      - name: Compile PyInstaller Standalone App
        shell: pwsh
        run: |
          python -m PyInstaller narratible.spec --noconfirm --workpath build\pyinstaller-work --distpath dist
          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller failed (exit code $LASTEXITCODE)."
          }
          Set-Content -Path 'dist\narratible\app-version.txt' -Value $env:APP_VERSION -NoNewline

      - name: Verify packaged TTS imports
        shell: pwsh
        run: |
          & 'dist\narratible\narratible.exe' --verify-tts-imports
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged TTS import verification failed (exit code $LASTEXITCODE)."
          }

      - name: Verify CUDA libraries bundled in dist
        shell: pwsh
        run: |
          $libDir = 'dist\narratible\_internal\torch\lib'
          if (-not (Test-Path "$libDir\torch_cuda.dll")) {
            throw "torch_cuda.dll not found in $libDir — the frozen build is CPU-only."
          }
          if (-not (Test-Path 'dist\narratible\_internal\chatterbox')) {
            throw 'Chatterbox package not found in frozen distribution.'
          }
          if (-not (Test-Path 'dist\narratible\_internal\qwen_tts')) {
            throw 'Qwen3-TTS package not found in frozen distribution.'
          }
          if (-not (Test-Path 'dist\narratible\_internal\optional_runtime\voice_enhancement.py')) {
            throw 'Isolated voice-enhancement worker not found in frozen distribution.'
          }
          Write-Host 'Confirmed torch_cuda.dll present in dist.'

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" packaging\installer.iss

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: narratible-Installer
          path: packaging/Output/narratible_Installer.exe
          if-no-files-found: error

      - name: Build Release Notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $changelogPath = 'CHANGELOG.md'

          if (-not (Test-Path $changelogPath)) {
            throw "CHANGELOG.md not found at repository root."
          }

          $content = Get-Content $changelogPath -Raw

          # Capture from "## <tag>" until the next "## " heading (or EOF).
          $escapedTag = [regex]::Escape($tag)
          $pattern = "(?ms)^##\s+$escapedTag\b.*?(?=^##\s+|\z)"
          $match = [regex]::Match($content, $pattern)

          if (-not $match.Success) {
            throw "No changelog section found for tag '$tag' in CHANGELOG.md"
          }

          $notes = $match.Value.Trim() + "`n"
          Set-Content -Path release-notes.md -Value $notes

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/Output/narratible_Installer.exe
          body_path: release-notes.md
