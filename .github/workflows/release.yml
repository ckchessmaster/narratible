name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish (e.g. 1.7.0 or v1.7.0).'
        required: true
        type: string
      publish_release:
        description: 'Publish the installer as a GitHub Release after building.'
        required: true
        type: boolean
        default: false

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set Version
        id: release_version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match 'refs/tags/(v.+)') {
            $releaseTag = $matches[1]
          } else {
            $requestedVersion = '${{ inputs.version }}'.Trim()
            $releaseTag = 'v' + ($requestedVersion -replace '^v', '')
          }
          $version = $releaseTag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Invalid release version '$releaseTag'. Expected a semantic version such as v1.7.0."
          }
          echo "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          echo "RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV
          echo "NARRATIBLE_APP_VERSION=$version" >> $env:GITHUB_ENV
          echo "VITE_APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Cache pip (base dependencies)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-base-${{ runner.os }}-${{ hashFiles('backend/requirements*.txt', 'backend/constraints.txt') }}
          restore-keys: pip-base-${{ runner.os }}-

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install Python Dependencies
        run: |
          python -m pip install "pip==26.2.1" "setuptools==70.2.0"
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-build.txt

      - name: Prepare private runtime tools
        shell: pwsh
        run: |
          pwsh -File packaging\prepare_runtime_tools.ps1 -PythonExe python -OutputDir build\runtime-tools

      - name: Verify slim build inputs
        shell: pwsh
        run: |
          python -c "from backend.app.runtime_engines import load_runtime_catalog; import edge_tts; catalog=load_runtime_catalog(); print('Slim base ready | edge-tts', edge_tts.__version__, '| managed profiles', len(catalog['profiles']))"
          if ($LASTEXITCODE -ne 0) {
            throw "Runtime profile source validation failed (exit code $LASTEXITCODE)."
          }
          $privatePython = Join-Path 'build\runtime-tools' (Get-Content 'build\runtime-tools\python-path.txt' -Raw)
          & $privatePython -c "import platform; print('Private Python', platform.python_version())"
          if ($LASTEXITCODE -ne 0) {
            throw "Private Python validation failed (exit code $LASTEXITCODE)."
          }
          & 'build\runtime-tools\uv.exe' --version
          if ($LASTEXITCODE -ne 0) {
            throw "uv validation failed (exit code $LASTEXITCODE)."
          }

      - name: Compile PyInstaller Standalone App
        shell: pwsh
        run: |
          python -m PyInstaller narratible.spec --clean --noconfirm --workpath build\pyinstaller-work --distpath dist
          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller failed (exit code $LASTEXITCODE)."
          }
          Set-Content -Path 'dist\narratible\app-version.txt' -Value $env:APP_VERSION -NoNewline

      - name: Verify slim packaged runtime
        shell: pwsh
        run: |
          $env:NARRATIBLE_RUNTIME_CATALOG = (Resolve-Path 'dist\narratible\_internal\runtime_profiles\catalog.json').Path
          python -c "from backend.app.runtime_engines import load_runtime_catalog; load_runtime_catalog(); print('Packaged runtime profile hashes OK')"
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged runtime profile validation failed (exit code $LASTEXITCODE)."
          }
          Remove-Item Env:NARRATIBLE_RUNTIME_CATALOG

          $verification = Start-Process -FilePath 'dist\narratible\narratible.exe' -ArgumentList '--verify-tts-imports' -Wait -PassThru
          if ($verification.ExitCode -ne 0) {
            throw "Slim packaged runtime verification failed (exit code $($verification.ExitCode))."
          }

      - name: Verify local AI is external to dist
        shell: pwsh
        run: |
          $internalDir = 'dist\narratible\_internal'
          $forbiddenPackages = @('torch', 'torchaudio', 'transformers', 'kokoro', 'f5_tts', 'chatterbox', 'qwen_tts', 'bitsandbytes')
          foreach ($packageName in $forbiddenPackages) {
            if (Test-Path "$internalDir\$packageName") {
              throw "Slim package unexpectedly contains $packageName."
            }
          }
          if (Get-ChildItem 'dist\narratible' -Recurse -Filter 'torch_cuda.dll' -ErrorAction SilentlyContinue) {
            throw 'Slim package unexpectedly contains torch_cuda.dll.'
          }
          foreach ($tclName in @('_tcl_data', '_tk_data', 'tkinter')) {
            if (Test-Path "$internalDir\$tclName") {
              throw "Slim package unexpectedly contains $tclName."
            }
          }
          if (-not (Test-Path "$internalDir\runtime-tools\uv.exe")) {
            throw 'Managed runtime uv.exe is missing from the frozen distribution.'
          }
          if (-not (Test-Path "$internalDir\runtime-tools\python-path.txt")) {
            throw 'Managed runtime Python marker is missing from the frozen distribution.'
          }
          if (-not (Test-Path 'dist\narratible\_internal\optional_runtime\voice_enhancement.py')) {
            throw 'Isolated voice-enhancement worker not found in frozen distribution.'
          }
          Write-Host 'Confirmed local AI packages are external to the slim base app.'

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" packaging\installer.iss

      - name: Verify installer release size
        shell: pwsh
        run: |
          $installer = Get-Item 'packaging\Output\narratible_Installer.exe'
          $distBytes = (Get-ChildItem 'dist\narratible' -Recurse -File | Measure-Object -Property Length -Sum).Sum
          Write-Host ("Unpacked app: {0:N1} MB" -f ($distBytes / 1MB))
          Write-Host ("Installer: {0:N1} MB" -f ($installer.Length / 1MB))
          if ($installer.Length -gt 1800MB) {
            throw 'Installer exceeds the 1.8 GiB release safety limit.'
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: narratible-Installer
          path: packaging/Output/narratible_Installer.exe
          if-no-files-found: error

      - name: Build Release Notes from CHANGELOG
        if: github.event_name != 'workflow_dispatch' || inputs.publish_release
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $changelogPath = 'CHANGELOG.md'

          if (-not (Test-Path $changelogPath)) {
            throw "CHANGELOG.md not found at repository root."
          }

          $content = Get-Content $changelogPath -Raw

          # Capture from "## <tag>" until the next "## " heading (or EOF).
          $escapedTag = [regex]::Escape($tag)
          $pattern = "(?ms)^##\s+$escapedTag\b.*?(?=^##\s+|\z)"
          $match = [regex]::Match($content, $pattern)

          if (-not $match.Success) {
            throw "No changelog section found for tag '$tag' in CHANGELOG.md"
          }

          $notes = $match.Value.Trim() + "`n"
          Set-Content -Path release-notes.md -Value $notes

      - name: Create GitHub Release
        if: github.event_name != 'workflow_dispatch' || inputs.publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.release_version.outputs.release_tag }}'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --notes-file release-notes.md
          } else {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target '${{ github.sha }}' --title $tag --notes-file release-notes.md
          }
          gh release upload $tag packaging\Output\narratible_Installer.exe --repo $env:GITHUB_REPOSITORY --clobber
